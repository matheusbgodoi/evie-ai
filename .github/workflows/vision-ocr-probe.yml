name: Vision OCR runtime diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-vision-routes:
    strategy:
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Record toolchain and virtualized compute devices
        run: |
          swift --version
          xcodebuild -version
          sw_vers
      - name: Compare public OCR routes on synthetic Portuguese content
        run: |
          xcrun swiftc -swift-version 6 -parse-as-library Scripts/vision-ocr-probe.swift -o "$RUNNER_TEMP/vision-ocr-probe"
          # Each route gets a fresh process; one failed framework must not poison
          # the others. The legacy global CPU flag's warning is diagnostic only.
          for route in modern-cpu legacy-3-cpu legacy-3-auto legacy-2-cpu legacy-3-global-cpu legacy-2-global-cpu; do
            "$RUNNER_TEMP/vision-ocr-probe" "$route"
          done
