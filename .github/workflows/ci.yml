name: CI

# All behavioral tests live in EvieCoreTests and run on the supported macOS 26
# runtime. The xcode-27 image also compiles the complete shell. Accurate Vision
# OCR fails in that image's macOS 27 VM even with every public CPU route; the
# isolated matrix probe and real M5/macOS 27 qualification are documented in
# docs/MACOS_RUNTIME.md. Scripts/test executes every case in two disjoint
# resource phases; no test is dropped or retried (ADR 0030).
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test the core on macOS 26
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Record the toolchain
        # Printed rather than asserted: when a build breaks on a runner and not
        # on the author's Mac, this is the first thing anybody wants to see.
        run: |
          swift --version
          xcodebuild -version
          sw_vers

      - name: Cache build products
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}-
            ${{ runner.os }}-spm-

      - name: Build the core
        run: swift build --target EvieCore -Xswiftc -warnings-as-errors

      - name: Run every behavioral test against the supported runtime
        run: Scripts/test --core-only

      - name: Verify settings persistence and responsive Keychain status
        env:
          EVIE_CORE_BUILD_DIR: ${{ github.workspace }}/.build/core-test-products/debug
        run: Scripts/model-settings-validation

      - name: Verify isolated research clipboard guards
        env:
          EVIE_CORE_BUILD_DIR: ${{ github.workspace }}/.build/core-test-products/debug
        run: Scripts/research-guard-validation

      - name: Verify voice revocation and native URL wake suppression
        env:
          EVIE_CORE_BUILD_DIR: ${{ github.workspace }}/.build/core-test-products/debug
        run: Scripts/voice-input-validation

  full-package:
    name: Build the full shell with Xcode 27
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Record the toolchain
        run: |
          swift --version
          xcodebuild -version
          sw_vers
      - name: Build the shell
        run: swift build -Xswiftc -warnings-as-errors
      - name: Compile the real native capture lifecycle driver
        run: Scripts/native-capture-validation --compile-only

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Every document referenced by another must exist
        # The repository's rule is that a claim lives in a document and is
        # linked, not restated. A link that rots breaks that rule silently, so
        # it is checked rather than trusted.
        run: |
          status=0
          while IFS= read -r file; do
            while IFS= read -r target; do
              [ -z "$target" ] && continue
              case "$target" in http*|mailto:*|'#'*) continue ;; esac
              resolved="$(dirname "$file")/${target%%#*}"
              if [ ! -e "$resolved" ]; then
                echo "$file -> $target (missing)"
                status=1
              fi
            done < <(grep -oE '\]\([^)]+\)' "$file" | sed 's/^](//; s/)$//')
          done < <(find . -name '*.md' -not -path './.build/*' -not -path './.git/*')
          exit $status

      - name: A release must not be claimed before it is cut
        # REL-001's own rule, enforced. This repository strikes a blocker
        # through when it closes, so a struck-through REL-001 is the claim, and
        # a dated 1.0.0 in the changelog is the evidence for it. One without the
        # other is a document lying about the state of the project.
        #
        # A first attempt matched `REL-001.*passed` and failed on the true line
        # "REL-001 — the first release. What it needs: QA-006 passed" — the
        # check was wrong, not the document. Hence matching the convention
        # rather than hopeful keywords.
        run: |
          dated=$(grep -cE '^## \[1\.0\.0\] - [0-9]{4}-[0-9]{2}-[0-9]{2}' CHANGELOG.md || true)
          struck=$(grep -cE '~~\*\*`REL-001`' docs/PROJECT_STATUS.md || true)
          if [ "$struck" -gt 0 ] && [ "$dated" -eq 0 ]; then
            echo "PROJECT_STATUS.md strikes REL-001 through, but CHANGELOG.md has no dated 1.0.0."
            exit 1
          fi
          if [ "$dated" -gt 0 ] && [ "$struck" -eq 0 ]; then
            echo "CHANGELOG.md dates 1.0.0, but PROJECT_STATUS.md still lists REL-001 as open."
            exit 1
          fi
          echo "Release claim and changelog agree (dated=$dated, struck=$struck)."
