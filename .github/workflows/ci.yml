name: CI

# Evie is a macOS application built against the macOS 27 SDK, and the newest
# image GitHub offers is macOS 26.5. What can be checked here is checked here,
# and what cannot is said plainly at the step that would have done it rather
# than quietly left out.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the core
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Record the toolchain
        # Printed rather than asserted: when a build breaks on a runner and not
        # on the author's Mac, this is the first thing anybody wants to see.
        run: |
          swift --version
          xcodebuild -version
          sw_vers

      - name: Cache build products
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}-
            ${{ runner.os }}-spm-

      - name: Build the core
        # `EvieCore`, not the `evie-shell` product, and this is a real
        # limitation rather than a preference.
        #
        # `EvieShell` needs the macOS 27 SDK. `EvieVisionDescriber` uses
        # `Attachment` from FoundationModels, which exists in the 27 SDK and not
        # in 26. The `if #available(macOS 27, *)` around it governs what runs,
        # not what compiles, so a 26 SDK fails to find the symbol at all. The
        # newest runner GitHub offers is macos-26 (26.5, Xcode 26.6), so the
        # shell cannot be built here until a macOS 27 image exists.
        #
        # This proves that the half of the code holding the agent loop, the
        # tools, retrieval and the permission boundary compiles somewhere other
        # than one laptop. It does not prove the shell does. See below.
        run: swift build --target EvieCore

      # There is no test step, and pretending otherwise would be worse than
      # saying so. `swift test` builds every target including EvieShell, which
      # needs the macOS 27 SDK. Building only EvieCoreTests and running with
      # --skip-build works on the author's Command Line Tools, where the bundle
      # is EvieCoreTests.xctest, and fails on a runner's full Xcode, where
      # SwiftPM looks for a whole-package EviePackageTests.xctest that a
      # single-target build never produces.
      #
      # So the 618 tests run on one Mac and are reported in every commit that
      # touches them. This is recorded as a limitation in docs/PROJECT_STATUS.md
      # rather than left for somebody to infer from a short workflow.
      #
      # What unblocks it: a macOS 27 runner image, at which point this becomes
      # `run: Scripts/test` and the comment goes.

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Every document referenced by another must exist
        # The repository's rule is that a claim lives in a document and is
        # linked, not restated. A link that rots breaks that rule silently, so
        # it is checked rather than trusted.
        run: |
          status=0
          while IFS= read -r file; do
            while IFS= read -r target; do
              [ -z "$target" ] && continue
              case "$target" in http*|mailto:*|'#'*) continue ;; esac
              resolved="$(dirname "$file")/${target%%#*}"
              if [ ! -e "$resolved" ]; then
                echo "$file -> $target (missing)"
                status=1
              fi
            done < <(grep -oE '\]\([^)]+\)' "$file" | sed 's/^](//; s/)$//')
          done < <(find . -name '*.md' -not -path './.build/*' -not -path './.git/*')
          exit $status

      - name: A release must not be claimed before it is cut
        # REL-001's own rule, enforced. This repository strikes a blocker
        # through when it closes, so a struck-through REL-001 is the claim, and
        # a dated 1.0.0 in the changelog is the evidence for it. One without the
        # other is a document lying about the state of the project.
        #
        # A first attempt matched `REL-001.*passed` and failed on the true line
        # "REL-001 — the first release. What it needs: QA-006 passed" — the
        # check was wrong, not the document. Hence matching the convention
        # rather than hopeful keywords.
        run: |
          dated=$(grep -cE '^## \[1\.0\.0\] - [0-9]{4}-[0-9]{2}-[0-9]{2}' CHANGELOG.md || true)
          struck=$(grep -cE '~~\*\*`REL-001`' docs/PROJECT_STATUS.md || true)
          if [ "$struck" -gt 0 ] && [ "$dated" -eq 0 ]; then
            echo "PROJECT_STATUS.md strikes REL-001 through, but CHANGELOG.md has no dated 1.0.0."
            exit 1
          fi
          if [ "$dated" -gt 0 ] && [ "$struck" -eq 0 ]; then
            echo "CHANGELOG.md dates 1.0.0, but PROJECT_STATUS.md still lists REL-001 as open."
            exit 1
          fi
          echo "Release claim and changelog agree (dated=$dated, struck=$struck)."
