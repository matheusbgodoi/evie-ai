name: Vision OCR runtime diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-vision-routes:
    runs-on: xcode-27
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Record toolchain and virtualized compute devices
        run: |
          swift --version
          xcodebuild -version
          sw_vers
      - name: Compare public OCR routes on synthetic Portuguese content
        run: |
          xcrun swiftc -swift-version 6 -parse-as-library -warnings-as-errors Scripts/vision-ocr-probe.swift -o "$RUNNER_TEMP/vision-ocr-probe"
          "$RUNNER_TEMP/vision-ocr-probe"
